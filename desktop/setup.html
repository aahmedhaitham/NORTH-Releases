<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect to NORTH Cloud</title>
    <link rel="stylesheet" href="setup.css" />
    <script defer src="setup.js"></script>
  </head>
  <body>
    <main>
      <strong>NORTH</strong>
      <h1>Connect your workspace</h1>
      <p>Enter the HTTPS address of your NORTH Cloud workspace.</p>
      <form>
        <label>Workspace address <input name="address" type="url" placeholder="https://north.example.com" required /></label>
        <button>Connect</button>
        <p role="alert"></p>
      </form>
    </main>
  </body>
</html>
